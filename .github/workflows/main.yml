name: Telegram Daily Post

"on":
  schedule:
    - cron: '0 19 * * *'
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      kind:
        description: "نوع المنشور"
        type: choice
        default: random
        options:
          - random
          - ayah
          - hadith

permissions:
  contents: read

concurrency:
  group: telegram-post
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          POST_TYPE: ${{ github.event.inputs.kind || 'random' }}
        run: python bot.py
