name: Telegram Daily Post

"on":
  schedule:
    # التوقيت في GitHub بالـ UTC. توقيت مكة = UTC+3
    - cron: '0 19 * * *'   # 10:00 مساءً بتوقيت مكة
    - cron: '0 1 * * *'    # 04:00 فجراً بتوقيت مكة
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-post
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests tzdata

      - name: Run Script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: python bot.py
